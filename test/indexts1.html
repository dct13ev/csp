<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bài tập 27/9</title>
  </head>
  <body>
    
    <header>
      <form>
        <label for="text">Textarea</label>
        <br />
        <textarea
          id="text"
          maxlength="140"
          placeholder="jQueryScript.Net"
        ></textarea>
        <br />
        <div class="bodem" id="text-count">Max 0 / 140</div>

        <hr />

        <label for="input">Input Field</label>
        <br />
        <input
          type="text"
          id="input"
          maxlength="20"
          placeholder="jQueryScript.Net j"
        />
        <br />
        <div class="bodem" id="input-count">Maximum 0 / 20</div>
      </form>
      <style>
        body {
          font-family: Arial, sans-serif;
          margin: 20px;
        }

        form {
          max-width: 400px;
          margin: auto;
        }

        label {
          font-weight: bold;
        }

        textarea,
        input[type="text"] {
          width: 100%;
          padding: 10px;
          margin-top: 5px;
          margin-bottom: 10px;
          border: 1px solid #ccc;
          border-radius: 4px;
        }

        .bodem {
          font-size: 0.9em;
          color: #555;
        }

        hr {
          margin: 20px 0;
        }
      </style>
    </header>
    
    <script>
      const textArea = document.getElementById("text");
      const textCount = document.getElementById("text-count");
      const inputField = document.getElementById("input");
      const inputCount = document.getElementById("input-count");

      textArea.addEventListener("input", () => {
        textCount.textContent = `Max ${textArea.value.length} / 140`;
      });

      inputField.addEventListener("input", () => {
        inputCount.textContent = `Maximum ${inputField.value.length} / 20`;
      });
    </script>
    <!-- end main -->
  </body>
</html>
