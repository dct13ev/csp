<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập Quản trị viên</title>
    <link rel="stylesheet" href="giao_dien/dangnhap/login.css">
</head>
<body>

    <div class="login-wrapper">
        <form class="login-form" action="" method="POST">
            <h2>Hệ thống bán hàng</h2>

            {{login_error}}

            <div class="input-group">
                <label for="username">Tài khoản</label>
                <input type="text" id="username" name="username" placeholder="Mã nhân viên..." required>
            </div>

            <div class="input-group">
                <label for="password">Mật khẩu</label>
                <input type="password" id="password" name="password" placeholder="Nhập mật khẩu..." required>
            </div>

            <button type="submit" class="btn-login">ĐĂNG NHẬP</button>
            <a href="index.php" class="back-home">← Quay lại trang chủ</a>
        </form>
    </div>

</body>
</html>
